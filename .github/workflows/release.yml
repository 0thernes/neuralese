name: release
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  VER: 17.1.0
  VERSION_CODE: 1710
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: npm ci
      - uses: actions/cache@v5
        with: { path: model, key: tinystories-model-v1 }
      - run: node tools/fetch-model.mjs
      - uses: actions/cache@v5
        with: { path: model/arch, key: arch-models-v1 }
      - run: node tools/fetch-arch-models.mjs   # ~3 GB, revision- and sha256-pinned; arch/encoder tests need it
      - run: npm run lint
      - run: node --test test/*.test.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: v17 shell (typecheck, unit tests, build)
        run: cd ui && bun install --frozen-lockfile && bun run typecheck && bun test tests && bun run build
      - name: headless browser smoke (worker == main-thread tokens, strict CSP, all tabs; streams TinyStories-8M from HF)
        run: |
          node tools/serve.mjs 8765 src & sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable) node test/smoke/engine-worker.smoke.mjs http://localhost:8765/

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: npm ci
      - run: cd desktop && npm ci && npm run dist:linux
      - name: smoke-test the packaged app (Xvfb; streams TinyStories-8M from Hugging Face)
        run: xvfb-run -a node desktop/smoke.cjs desktop/dist/linux-unpacked/neuralese
      - run: cd desktop/dist && ls -la && sha256sum *.AppImage *.deb
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            desktop/dist/Neuralese-${{ env.VER }}-x86_64.AppImage
            desktop/dist/Neuralese-${{ env.VER }}-amd64.deb
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: cd desktop && npm ci && npm run dist:win
        shell: bash
      - run: ls -la desktop/dist && sha256sum desktop/dist/*.exe
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            desktop/dist/Neuralese-Setup-${{ env.VER }}-x64.exe
            desktop/dist/Neuralese-${{ env.VER }}-x64-portable.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && node tools/build-www.mjs
      - run: npx cap add android
      - run: sed -i "s/versionCode 1$/versionCode $VERSION_CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle && grep -n version android/app/build.gradle
      # Release-signed APK when the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets exist; otherwise the
      # debug-signed APK (named -debug) is shipped and RELEASE_NOTES says so. Signing uses apksigner from the runner's build-tools.
      - name: build APK
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}', KSP: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}', KA: '${{ secrets.ANDROID_KEY_ALIAS }}' }
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.jks"; BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/al.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KSP --ks-key-alias "$KA" --out ../Neuralese-$VER.apk "$RUNNER_TEMP/al.apk"
            "$BT/apksigner" verify --print-certs ../Neuralese-$VER.apk; rm -f "$RUNNER_TEMP/ks.jks"
          else
            echo "::warning::no Android keystore secrets: shipping the debug-signed APK"; ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Neuralese-$VER-debug.apk
          fi
          cd .. && sha256sum Neuralese-$VER*.apk
      - uses: actions/upload-artifact@v6
        with: { name: android, path: 'Neuralese-${{ env.VER }}*.apk', if-no-files-found: error }

  ios:
    needs: test
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: npm ci && node tools/build-www.mjs
      - run: npx cap add ios
      - run: if [ -f ios/App/Podfile ]; then cd ios/App && pod install; fi
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=14 CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Neuralese-$VER-simulator.app.zip" App.app
      - name: Build for device (unsigned .ipa, re-sign with AltStore / Sideloadly)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=14 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/ && zip -qry Neuralese-$VER-unsigned.ipa Payload
      - name: Optional signed .ipa (only if all four IOS_* secrets exist)
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KC=$RUNNER_TEMP/b.keychain-db; security create-keychain -p x "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p x "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/c.p12; security import $RUNNER_TEMP/c.p12 -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"; security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles; echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nl.mobileprovision
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=14 archive
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>method</key><string>development</string><key>teamID</key><string>%s</string></dict></plist>' "$TEAM" > eo.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist eo.plist -exportPath build/signed && cp build/signed/*.ipa Neuralese-$VER-signed.ipa
      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: |
            Neuralese-${{ env.VER }}-simulator.app.zip
            Neuralese-${{ env.VER }}-unsigned.ipa
            Neuralese-${{ env.VER }}-signed.ipa
          if-no-files-found: warn

  release:
    needs: [linux, windows, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - run: ls -la out && cd out && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Neuralese ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: out/*
